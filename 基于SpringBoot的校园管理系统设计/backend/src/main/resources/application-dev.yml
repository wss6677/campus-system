# ============================================================
#  dev 环境专属覆盖项
#  这里只放「和 application.yml 不同」的配置。
#  所有密码类内容一律不写在这里，统一放在 application-local.yml。
#  （profile 专属文件的优先级高于 spring.config.import 引入的文件，
#    所以密码绝不能在这里重复声明，否则会覆盖掉本地配置。）
# ============================================================

spring:
  datasource:
    # dev 环境用更小的连接池
    druid:
      initial-size: 2
      min-idle: 2
      max-active: 10
      max-wait: 30000
      validation-query: SELECT 1
      test-while-idle: true
      filters: stat

mybatis-plus:
  configuration:
    # dev 环境把 SQL 直接打到控制台，方便调试
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

knife4j:
  enable: true
  production: false
  setting:
    language: zh_cn
