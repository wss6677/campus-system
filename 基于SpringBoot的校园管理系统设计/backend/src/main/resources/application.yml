server:
  port: 8080
  servlet:
    context-path: /
    encoding:
      charset: UTF-8
      force: true
  tomcat:
    uri-encoding: UTF-8
    max-swallow-size: -1

spring:
  application:
    name: campus-announcement
  profiles:
    active: dev
  # ------------------------------------------------------------
  #  私密配置（数据库密码 / Redis 密码 / 邮箱授权码 / JWT 密钥 /
  #  Druid 控制台密码）全部写在 application-local.yml 里。
  #  该文件已被 .gitignore 排除，不会上传到 GitHub。
  #  换电脑时请复制 application-local.yml.example 并填入自己的值。
  #  前缀 optional: 表示该文件不存在时也不报错。
  # ------------------------------------------------------------
  config:
    import: optional:classpath:application-local.yml
  main:
    allow-circular-references: true
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
      fail-on-empty-beans: false
    deserialization:
      fail-on-unknown-properties: false
  servlet:
    multipart:
      enabled: true
      max-file-size: 20MB
      max-request-size: 50MB
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/campus_announcement?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true
    # username / password 见 application-local.yml
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 20
      max-wait: 60000
      time-between-eviction-runs-millis: 60000
      min-evictable-idle-time-millis: 300000
      validation-query: SELECT 1
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false
      pool-prepared-statements: true
      max-pool-prepared-statement-per-connection-size: 20
      filters: stat,wall
      connection-properties: druid.stat.mergeSql=true;druid.stat.slowSqlMillis=2000
      stat-view-servlet:
        enabled: true
        url-pattern: /druid/*
        # login-username / login-password 见 application-local.yml
        reset-enable: false
      web-stat-filter:
        enabled: true
        url-pattern: /*
        exclusions: "*.js,*.gif,*.jpg,*.png,*.css,*.ico,/druid/*"
  data:
    redis:
      host: localhost
      port: 6379
      database: 1
      # password 见 application-local.yml
      timeout: 5000ms
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2
          max-wait: 3000ms
  mail:
    host: smtp.qq.com
    port: 465
    # username / password 见 application-local.yml
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: true
          starttls:
            enable: false
          timeout: 10000
          connectiontimeout: 10000
          writetimeout: 10000

mybatis-plus:
  mapper-locations: classpath*:mapper/*.xml
  type-aliases-package: com.ivy.campus.entity
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
    call-setters-on-nulls: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    banner: false
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
      insert-strategy: not_null
      update-strategy: not_null
      table-underline: true

knife4j:
  enable: true
  setting:
    language: zh_cn
    enable-version: true
    enable-open-api: false
    swagger-model-name: 数据模型

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  default-flat-param-object: true

campus:
  upload:
    # 相对路径按「启动时的工作目录」解析；需要固定位置时改成绝对路径，如 D:/campus-upload/
    path: ./upload/
    url-prefix: /upload/
  jwt:
    # secret 见 application-local.yml
    expire: 86400

logging:
  level:
    root: info
    com.ivy.campus: debug
    com.ivy.campus.mapper: debug
    org.springframework.web: info
    com.alibaba.druid: warn
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: ./logs/campus-announcement.log
